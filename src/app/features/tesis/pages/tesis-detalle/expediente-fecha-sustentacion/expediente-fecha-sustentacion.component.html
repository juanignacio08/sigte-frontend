<div class="space-y-4">
    <!-- Filtros -->
    <div class="overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm p-6 space-y-4">
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
            <!-- Escuela -->
            <div>
                <label for="filtroEsc" class="text-xs font-semibold text-slate-600">Escuela Profesional</label>
                    <p-select inputId="filtroEsc" [options]="escuelasFiltro()" [ngModel]="escuelaSeleccionada()"
                        (ngModelChange)="escuelaSeleccionada.set($event)" optionLabel="denominacion" optionValue="id"
                        placeholder="Todas las Escuelas" size="small" class="w-full"
                        [disabled]="controls.loadingCatalogos()" />
            </div>

            <!-- Ambiente -->
            <div>
                <label class="block text-sm font-medium mb-1">
                    Ambiente
                </label>

                <select [(ngModel)]="ambienteSeleccionado" (change)="aplicarFiltros()"
                    class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm">

                    <option value="TODOS">Todos los ambientes</option>

                    @for (ambiente of ambientes; track ambiente.id) {
                    <option [value]="ambiente.id">
                        {{ ambiente.nombre }}
                    </option>
                    }
                </select>
            </div>
        </div>

        <!-- Leyenda de escuelas -->
        <div class="flex flex-wrap items-center gap-4 text-xs text-slate-600">
            @for (escuela of escuelasFiltro(); track escuela.id) {
            <div class="flex items-center gap-2">
                <span class="w-3 h-3 rounded-full">
                </span>
                {{ escuela.denominacion }}
            </div>
            }
        </div>
    </div>

    <section class="overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm p-6">
        <full-calendar #calendar [options]="calendarOptions">
        </full-calendar>
    </section>
</div>
