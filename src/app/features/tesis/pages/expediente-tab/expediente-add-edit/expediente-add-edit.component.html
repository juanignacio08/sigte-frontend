<p-dialog [(visible)]="visible" [modal]="true" [style]="{ width: '92%', maxWidth: '650px' }" [draggable]="false"
    [resizable]="false" [header]="isEdit() ? 'Actualizar Expediente de Tesis' : 'Registrar Nuevo Expediente'"
    (onHide)="cerrarModal()">

    <form [formGroup]="form" (ngSubmit)="guardar()" class="space-y-4 mt-2">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div class="flex flex-col gap-1.5">
                <label class="text-xs font-semibold text-slate-700">N° de Expediente *</label>
                <input pInputText formControlName="numeroExpediente" pSize="small" placeholder="EXP-2025-0142" />
            </div>

            <div class="flex flex-col gap-1.5">
                <label class="text-xs font-semibold text-slate-700">Etapa de Trámite *</label>
                <p-select [options]="etapas()" formControlName="etapaCodigo" optionLabel="denomination"
                    optionValue="code" placeholder="Seleccione etapa" size="small" class="w-full" />
            </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div class="flex flex-col gap-1.5">
                <label class="text-xs font-semibold text-slate-700">N° de Revisión *</label>
                <input type="number" pInputText formControlName="numeroRevision" pSize="small" />
            </div>

            <div class="flex flex-col gap-1.5 relative">
                <label class="text-xs font-semibold text-slate-700">Fecha de Ingreso</label>
                <p-datepicker formControlName="fechaRegistro" dateFormat="yy-mm-dd" size="small" class="w-full" [appendTo]="'body'" />
            </div>
        </div>

        <!-- Subida de Archivos PDFs (Solo visible si es Creación) -->
        @if (!isEdit()) {
        <div class="flex flex-col gap-1.5 pt-1">
            <label class="text-xs font-semibold text-slate-700">Adjuntar Archivos PDF (1 a 5) *</label>
            <input type="file" accept="application/pdf" multiple (change)="onArchivosSelected($event)"
                class="text-xs border border-slate-200 rounded-xl p-2 bg-slate-50 cursor-pointer" />
            <span class="text-[10px] text-slate-400">Debe seleccionar entre 1 y 5 archivos PDF firmados digitalmente.</span>
            
            @if (archivosNuevos.length > 0) {
                <span class="text-xs font-bold text-emerald-600 mt-1">
                    <i class="pi pi-check-circle mr-1"></i> {{ archivosNuevos.length }} archivo(s) seleccionado(s)
                </span>
            }
        </div>
        }

        <div class="flex justify-end gap-2 pt-4 border-t border-slate-100">
            <app-button type="button" action="cancel" (onClick)="cerrarModal()">Cancelar</app-button>
            <app-button type="submit" action="save" [withIcon]="true" [disabled]="form.invalid || loading()" [loading]="loading()">
                {{ loading() ? 'Guardando...' : 'Guardar' }}
            </app-button>
        </div>
    </form>
</p-dialog>
