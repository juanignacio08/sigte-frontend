<button [type]="type" [disabled]="disabled || loading" [pTooltip]="messageTootip" tooltipPosition="top"
  (click)="onClick.emit($event)" [ngClass]="[
    'font-medium rounded-lg transition-colors flex items-center justify-center gap-1.5 disabled:opacity-50 disabled:cursor-not-allowed hover:cursor-pointer',
    variantClasses[effectiveVariant],
    sizeClasses
  ]">

  <!-- Icono de Cargando -->
  @if (loading) {
  <i class="pi pi-spin pi-spinner"></i>
  }
  
  <!-- Icono Predefinido o Personalizado -->
  @else if (effectiveIcon && iconDirection === 'left') {
  <i class="pi {{ effectiveIcon }}" style="font-size: 1rem;">
  </i>
  }

  <!-- Contenido -->

  @if (!onlyIcon) {
  <ng-content>
    {{ defaultText }}
  </ng-content>
  }

  <!-- Icono a la derecha -->

  @if (!loading && effectiveIcon && iconDirection === 'right') {
  <i class="pi {{ effectiveIcon }}" style="font-size: 1rem;">
  </i>
  }

</button>
