@if (visible()) {
  <div
    class="fixed inset-0 z-[99999] flex items-center justify-center bg-white/60 backdrop-blur-[2px]"
    role="alert"
    aria-live="assertive"
    aria-busy="true">

    <div class="mx-4 flex w-full max-w-xs flex-col items-center rounded-2xl border border-slate-200 bg-white/95 px-8 py-7 shadow-xl">

      <!-- SPINNER -->
      <div class="relative flex h-16 w-16 items-center justify-center">

        <div class="absolute inset-0 animate-spin rounded-full border-4 border-blue-100 border-t-blue-800"></div>

        <i class="pi pi-envelope text-xl text-blue-800"></i>

      </div>

      <!-- MENSAJE -->
      <h3 class="mt-5 text-sm font-bold text-slate-800">
        {{ message() }}
      </h3>

      <p class="mt-1 text-center text-xs text-slate-500">
        Por favor, espera mientras completamos el proceso.
      </p>

      <!-- INDICADOR DE PROGRESO INDETERMINADO -->
      <div class="mt-5 h-1.5 w-full overflow-hidden rounded-full bg-blue-100">
        <div class="h-full w-1/3 animate-loading-progress rounded-full bg-blue-800"></div>
      </div>

    </div>

  </div>
}
