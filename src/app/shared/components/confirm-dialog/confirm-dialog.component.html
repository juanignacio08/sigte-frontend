<p-dialog [(visible)]="visible" [modal]="true" [style]="{ width: '90%', maxWidth: '460px' }" [draggable]="false"
    [resizable]="false" [showHeader]="false" (onHide)="cerrar()">

    <div class="p-6 text-center">
        <!-- Icono Ilustrativo Dinámico -->
        <div class="w-14 h-14 mx-auto mb-4 rounded-full flex items-center justify-center transition-colors"
            [ngClass]="[config().iconBgColor, config().iconTextColor]">
            <i [class]="'pi ' + config().icon" style="font-size: 1.5rem"></i>
        </div>

        <!-- Título -->
        <h3 class="text-lg font-bold text-slate-900 mb-2">
            {{ config().title }}
        </h3>

        <!-- Mensaje / Detalle -->
        <p class="text-sm text-slate-600 mb-4 leading-relaxed">
            {{ config().message }}
        </p>

        <!-- Input Opcional de Motivo (Solo si se solicita para desactivar) -->
        @if (requiereMotivo()) {
            <form [formGroup]="form" class="mb-5 text-left">
                <label class="block text-xs font-semibold text-slate-700 mb-1">
                    Motivo de desactivación *
                </label>
                <input pInputText formControlName="motivo" placeholder="Ingrese el motivo detallado..." 
                    class="w-full text-xs" pSize="small" />
                @if (form.get('motivo')?.invalid && form.get('motivo')?.touched) {
                    <small class="text-xs text-rose-600 mt-1 block">El motivo es obligatorio (mínimo 5 caracteres).</small>
                }
            </form>
        }

        <!-- Botones de Acción -->
        <div class="flex items-center justify-center gap-3">
            <app-button type="button" variant="outline" (onClick)="cerrar()">
                Cancelar
            </app-button>

            <app-button type="button" [action]="actionToButtonType()" [disabled]="loading() || (requiereMotivo() && form.invalid)" (onClick)="confirmar()">
                {{ loading() ? 'Procesando...' : config().confirmLabel }}
            </app-button>
        </div>
    </div>

</p-dialog>
